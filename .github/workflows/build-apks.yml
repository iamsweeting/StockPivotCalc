name: Build Android APKs

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apks:
    name: Build two APKs (StockPivot + BatchStock)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          yes | flutter doctor --android-licenses >/dev/null 2>&1 || true

      - name: Install flet CLI
        run: pip install flet==0.86.5

      - name: Build StockPivot APK (单股版)
        run: >
          flet build apk StockPivot
          --project stockpivot
          --org com.pivottool
          --bundle-id com.pivottool.stockpivot
          --product "股票枢轴点"
          --artifact StockPivotCalc
          --module-name main
          --arch arm64-v8a
          -o "$GITHUB_WORKSPACE/dist/StockPivot"
          --yes

      - name: Build BatchStock APK (批量版)
        run: >
          flet build apk BatchStock
          --project batchstock
          --org com.pivottool
          --bundle-id com.pivottool.batchstock
          --product "批量枢轴点"
          --artifact BatchStock
          --module-name main
          --arch arm64-v8a
          -o "$GITHUB_WORKSPACE/dist/BatchStock"
          --yes

      - name: List built APKs
        run: |
          echo "=== dist 目录结构 ==="
          find "$GITHUB_WORKSPACE/dist" -type f | sort
          echo "=== 全仓库 APK 文件 ==="
          find "$GITHUB_WORKSPACE" -name "*.apk" -type f | sort

      - name: Upload APKs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            dist/StockPivot/*.apk
            dist/BatchStock/*.apk
          if-no-files-found: error
          retention-days: 30
